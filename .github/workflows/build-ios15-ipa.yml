name: Build iOS 15 IPA (iPhone 7 / TrollStore)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/ios15-iphone7-compat

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          ls -d /Applications/Xcode* || true
          for app in /Applications/Xcode_16*.app /Applications/Xcode.app; do
            if [ -d "$app" ]; then
              echo "Selecting $app"
              sudo xcode-select -s "$app"
              break
            fi
          done
          xcodebuild -version

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web frontend
        run: pnpm run web:build

      - name: Enable HTTP access for mobile
        run: ./scripts/ci/configure-mobile-http.sh enable ios

      - name: Build mobile bundle
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri/crates/tauritavern
          tauriScript: node ../../../scripts/tauri-app.mjs
          mobile: ios
          args: --verbose
          uploadWorkflowArtifacts: true
          uploadPlainBinary: true
          workflowArtifactNamePattern: 'TauriTavern-iOS15.8-iPhone7-[platform]-[arch]-[bundle]'

      - name: Locate and verify built IPA
        if: always()
        run: |
          echo "=== Searching for generated IPA files ==="
          find . -name "*.ipa" -ls || true
