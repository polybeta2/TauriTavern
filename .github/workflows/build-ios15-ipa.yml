name: Build iOS 15 IPA (iPhone 7 / TrollStore)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/ios15-iphone7-compat

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          ls -d /Applications/Xcode* || true
          for app in /Applications/Xcode_16*.app /Applications/Xcode.app; do
            if [ -d "$app" ]; then
              echo "Selecting $app"
              sudo xcode-select -s "$app"
              break
            fi
          done
          xcodebuild -version
          sudo xcodebuild -runFirstLaunch || true
          xcrun simctl list runtimes > /dev/null 2>&1 || true

      - name: Setup unsigned xcodebuild wrapper
        run: |
          DEVELOPER_DIR=$(xcode-select -p)
          echo "Configuring xcodebuild wrapper for: $DEVELOPER_DIR"
          REAL_XCODEBUILD="$DEVELOPER_DIR/usr/bin/xcodebuild"
          sudo mv "$REAL_XCODEBUILD" "${REAL_XCODEBUILD}.real"
          sudo cp scripts/ci/xcodebuild-wrapper.sh "$REAL_XCODEBUILD"
          sudo chmod +x "$REAL_XCODEBUILD"
          xcodebuild -version

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web frontend
        run: pnpm run web:build

      - name: Enable HTTP access for mobile
        run: ./scripts/ci/configure-mobile-http.sh enable ios

      - name: Build mobile bundle
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_DEVELOPMENT_TEAM: "0000000000"
        with:
          projectPath: src-tauri/crates/tauritavern
          tauriScript: node ../../../scripts/tauri-app.mjs
          mobile: ios
          args: --verbose
          uploadWorkflowArtifacts: false
          uploadPlainBinary: false

      - name: Package IPA for TrollStore
        run: |
          echo "=== Locating built .app bundle ==="
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "tauritavern_iOS.app" -type d 2>/dev/null | grep -i "Release-iphoneos" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d 2>/dev/null | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "*.app" -type d 2>/dev/null | head -n 1)
          fi
          echo "Found app bundle: $APP_PATH"
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "Error: Application bundle not found!"
            find ~/Library/Developer/Xcode/DerivedData -maxdepth 5 || true
            exit 1
          fi

          echo "=== Ad-hoc signing app bundle ==="
          codesign --force --deep --sign - "$APP_PATH" || true

          echo "=== Creating IPA package ==="
          rm -rf ipa_staging TauriTavern-iOS15.8-iPhone7.ipa
          mkdir -p ipa_staging/Payload
          cp -R "$APP_PATH" ipa_staging/Payload/
          cd ipa_staging
          zip -r -9 ../TauriTavern-iOS15.8-iPhone7.ipa Payload
          cd ..

          ls -lh TauriTavern-iOS15.8-iPhone7.ipa

      - name: Upload TrollStore IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TauriTavern-iOS15.8-iPhone7-ipa
          path: TauriTavern-iOS15.8-iPhone7.ipa
          if-no-files-found: error

      - name: Publish GitHub Release for easy mobile download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v2.2.0-ios15-trollstore"
          gh release delete "$TAG_NAME" -y || true
          git tag -d "$TAG_NAME" || true
          git push origin ":refs/tags/$TAG_NAME" || true
          gh release create "$TAG_NAME" TauriTavern-iOS15.8-iPhone7.ipa \
            --title "TauriTavern iOS 15.8 (iPhone 7 / TrollStore)" \
            --notes "TauriTavern iOS 15.8.3 Port for iPhone 7 (TrollStore). Install via TrollStore 2 for permanent activation."
