name: Auto Pre-Release Scheduler

on:
  # Scheduled Canary dispatch is specific to upstream (Darkatse/TauriTavern).
  # Disabled in forks to prevent daily failed runs.
  # schedule:
  #   - cron: "0 10 * * *"
  workflow_dispatch:

concurrency:
  group: auto-prerelease-scheduler
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.repository == 'Darkatse/TauriTavern'
    runs-on: ubuntu-latest
    name: dispatch-canary-dev

    steps:
      - name: Dispatch Canary build when dev advances
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            let branchData;
            try {
              const res = await github.rest.repos.getBranch({
                owner,
                repo,
                branch: "dev",
              });
              branchData = res.data;
            } catch (err) {
              if (err.status === 404) {
                core.info(`Branch 'dev' not found in ${owner}/${repo}; skipping Canary dispatch.`);
                return;
              }
              throw err;
            }

            const headSha = branchData.commit.sha;
            const { data: canaryCommit } = await github.rest.repos.getCommit({
              owner,
              repo,
              ref: "Canary",
            });

            if (canaryCommit.sha === headSha) {
              core.info(`Skipping Canary: dev ${headSha} is already published.`);
              return;
            }

            core.notice(`Canary ${canaryCommit.sha} -> dev ${headSha}; dispatching.`);

            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: "canary-release.yml",
              ref: "dev",
            });
